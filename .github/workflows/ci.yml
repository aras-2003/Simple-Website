name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SITE_BASE_URL: https://arkadiuszkamrowski.com
  SITE_PRODUCTION_HOST: arkadiuszkamrowski.com
  REQUIRE_PRODUCTION_SITE: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Astro type, build, static and contact API validation
        run: npm run test:static
      - name: External reference check
        run: node tests/external-links.mjs
      - name: Upload static artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site-dist
          path: dist
          if-no-files-found: error

  accessibility-and-browsers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build site
        run: npm run build
      - name: Install release browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: WCAG 2.2 A/AA automated audit
        run: npm run test:a11y
      - name: Chromium Firefox WebKit smoke matrix
        run: npm run test:browsers
      - name: Upload browser reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-report
          path: artifacts
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build site image for CI
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          tags: personal-site:ci
          build-args: |
            SITE_BASE_URL=https://arkadiuszkamrowski.com
            SITE_PRODUCTION_HOST=arkadiuszkamrowski.com
            REQUIRE_PRODUCTION_SITE=1
      - name: Build contact API image for CI
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: server/Dockerfile
          load: true
          push: false
          tags: personal-contact:ci
      - name: Runtime E2E through NGINX and contact API
        run: node tests/container-e2e.mjs

      - name: Trivy site image gate
        id: trivy_site
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: personal-site:ci
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy contact API image gate
        id: trivy_contact
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: personal-contact:ci
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Write site vulnerability report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: personal-site:ci
          format: json
          output: trivy-site.json
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Write contact vulnerability report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: personal-contact:ci
          format: json
          output: trivy-contact.json
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload container security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-security-reports
          path: |
            trivy-site.json
            trivy-contact.json
          if-no-files-found: error

      - name: Enforce container vulnerability gate
        if: always()
        run: |
          echo "site scan outcome: ${{ steps.trivy_site.outcome }}"
          echo "contact scan outcome: ${{ steps.trivy_contact.outcome }}"
          test "${{ steps.trivy_site.outcome }}" = "success"
          test "${{ steps.trivy_contact.outcome }}" = "success"
