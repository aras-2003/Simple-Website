name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Astro type, build, static and contact API validation
        run: npm run test:static
      - name: Upload static artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist
          if-no-files-found: error

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build site
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: WCAG 2.2 A/AA automated audit
        run: npm run test:a11y
      - name: Upload accessibility report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report
          path: artifacts
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build site image for CI
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: personal-site:ci
      - name: Build contact API image for CI
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          load: true
          push: false
          tags: personal-contact:ci
      - name: Trivy site image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: personal-site:ci
          format: sarif
          output: trivy-site.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy contact API image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: personal-contact:ci
          format: sarif
          output: trivy-contact.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload site scan to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-site.sarif
          category: site-container
      - name: Upload contact scan to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-contact.sarif
          category: contact-container
