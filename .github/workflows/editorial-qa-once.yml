name: One-time editorial QA
on:
  push:
    branches: [fix/pl-editorial-en-dashes-404]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fix editorial grammar, add 404 test, and remove temporary workflow
        run: |
          python3 scripts/editorial-qa-once.py
          node tests/404-worker.mjs
          rm scripts/editorial-qa-once.py .github/workflows/editorial-qa-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Correct Polish inflection and test localized 404 responses'
          git push origin HEAD:fix/pl-editorial-en-dashes-404
