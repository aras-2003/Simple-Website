name: Bootstrap dependency lock

on:
  push:
    branches: [hardening/full-audit-2026-09-05]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: hardening/full-audit-2026-09-05
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Commit package-lock.json once
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json already committed"
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: commit deterministic dependency lock'
          git push origin HEAD:hardening/full-audit-2026-09-05
