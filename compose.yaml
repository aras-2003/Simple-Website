services:
  site:
    build:
      context: .
      args:
        SITE_BASE_URL: http://localhost:${PORT:-8080}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
