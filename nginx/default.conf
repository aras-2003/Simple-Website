server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;
  absolute_redirect off;

  # NGINX 1.29.3+ can merge parent add_header values with location-specific
  # cache/content headers. Without this, a nested add_header silently drops
  # the server-level security policy for that location.
  add_header_inherit merge;

  # These values intentionally mirror the active Cloudflare Response Header
  # Transform Rule "Security Headers - Baseline". Cloudflare is authoritative
  # at the public edge; keeping the same values here preserves the policy for
  # container/runtime tests and as origin-side defense in depth.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  # Turnstile is the only approved third-party browser runtime at launch.
  # Cloudflare documents challenges.cloudflare.com for script-src/frame-src.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; script-src-attr 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'" always;

  # The apex domain is canonical. Cloudflare owns the production edge redirect;
  # this matching 308 remains a deterministic origin-side fallback.
  if ($host = www.arkadiuszkamrowski.com) {
    return 308 https://arkadiuszkamrowski.com$request_uri;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location = /api/contact {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    # Production traffic is expected to reach this origin only through
    # Cloudflare. CF-Connecting-IP is therefore the browser identity used by
    # the lightweight application limiter. The deployment platform must block
    # trivial direct-origin bypass before this trust boundary is relied on.
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;

    # The API keeps its own defensive headers when run standalone. At the
    # public edge, hide overlapping upstream values so the response exposes a
    # single canonical browser policy instead of comma-joined duplicates.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
    proxy_send_timeout 12s;
    client_max_body_size 32k;
  }

  # Canonical public URLs never end in a slash (except the site root).
  location ~ ^(.+)/$ {
    return 308 $1$is_args$args;
  }

  # Fingerprinted Astro bundles can be cached permanently.
  location ^~ /_astro/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Human-named public assets can change without changing the path, so avoid
  # immutable caching. Revalidation keeps portrait, favicon and OG updates safe.
  location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|json|webmanifest)$ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600";
    try_files $uri =404;
  }

  location ~ /\.(?!well-known/) {
    deny all;
  }

  location / {
    expires -1;
    try_files $uri $uri/index.html =404;
  }
}
