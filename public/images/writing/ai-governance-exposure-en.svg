<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>AI Governance</title><desc>Greater exposure requires stronger control.</desc><defs>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#6B645A" flood-opacity=".20"/></filter>
<filter id="softshadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#6B645A" flood-opacity=".13"/></filter>
<linearGradient id="greenFront" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#315F49"/><stop offset="1" stop-color="#173B2C"/></linearGradient>
<linearGradient id="greenSide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#153628"/><stop offset="1" stop-color="#0D291E"/></linearGradient>
<linearGradient id="greenTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#749180"/><stop offset="1" stop-color="#426A55"/></linearGradient>
<linearGradient id="stoneFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFAF6"/><stop offset="1" stop-color="#E5E0D5"/></linearGradient>
<linearGradient id="stoneTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0ECE4"/></linearGradient>
<linearGradient id="stoneSide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DDD7CC"/><stop offset="1" stop-color="#C8C1B5"/></linearGradient>
<linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DCE9E1"/><stop offset="1" stop-color="#C9DCCF"/></linearGradient>
<pattern id="marble" width="54" height="54" patternUnits="userSpaceOnUse"><rect width="54" height="54" fill="#234936"/><path d="M-8 39 C8 24,12 8,30 -4 M12 60 C26 46,31 28,58 18 M-5 14 C9 19,18 24,27 38" fill="none" stroke="#8BA394" stroke-width="2" opacity=".45"/><path d="M4 46 C18 36,25 16,43 5 M30 58 C36 42,47 34,62 31" fill="none" stroke="#C7D0C8" stroke-width="1" opacity=".3"/></pattern>
</defs><rect width="1200" height="760" fill="#F7F4ED"/><text x="70" y="80" font-family="Georgia,serif" font-size="62" fill="#172019">AI Governance</text><text x="70" y="125" font-family="Georgia,serif" font-size="28" fill="#172019">Greater exposure requires stronger control.</text><text x="220" y="205" font-family="Arial" font-size="20" font-weight="700" fill="#172019" text-anchor="middle">1. Work support</text><text x="220" y="236" font-family="Arial" font-size="14" fill="#656961" text-anchor="middle">AI prepares</text><text x="220" y="258" font-family="Arial" font-size="14" fill="#656961" text-anchor="middle">e.g. a note or summary</text><text x="600" y="205" font-family="Arial" font-size="20" font-weight="700" fill="#172019" text-anchor="middle">2. Recommendation</text><text x="600" y="236" font-family="Arial" font-size="14" fill="#656961" text-anchor="middle">AI recommends a decision,</text><text x="600" y="258" font-family="Arial" font-size="14" fill="#656961" text-anchor="middle">e.g. for a customer</text><text x="980" y="205" font-family="Arial" font-size="20" font-weight="700" fill="#172019" text-anchor="middle">3. Autonomous action</text><text x="980" y="236" font-family="Arial" font-size="14" fill="#656961" text-anchor="middle">AI executes an action</text><text x="980" y="258" font-family="Arial" font-size="14" fill="#656961" text-anchor="middle">e.g. in a system</text><g filter="url(#softshadow)"><rect x="135" y="300" width="170" height="105" rx="14" fill="#FBFAF6" stroke="#DDD7CD"/><path d="M148 309 h145" stroke="#fff" stroke-width="2"/></g><rect x="165" y="327" width="100" height="5" rx="2" fill="#7B9B8A" opacity=".7"/><rect x="165" y="347" width="80" height="5" rx="2" fill="#7B9B8A" opacity=".55"/><rect x="165" y="367" width="65" height="5" rx="2" fill="#7B9B8A" opacity=".4"/><circle cx="275" cy="382" r="25" fill="#789789" filter="url(#softshadow)"/><path d="M275 369 l4 9 l9 4 l-9 4 l-4 9 l-4 -9 l-9 -4 l9 -4 z" fill="#F7F4ED"/><g filter="url(#softshadow)"><path d="M515 300 h170 v86 h-74 l-22 20 v-20 h-74 z" fill="#FBFAF6" stroke="#DDD7CD"/><path d="M529 309 h142" stroke="#fff" stroke-width="2"/></g><rect x="552" y="330" width="96" height="5" rx="2" fill="#789789"/><rect x="552" y="351" width="70" height="5" rx="2" fill="#789789"/><circle cx="655" cy="382" r="25" fill="#789789" filter="url(#softshadow)"/><path d="M655 370 v24 M643 382 h24" stroke="#F7F4ED" stroke-width="3"/><g filter="url(#softshadow)"><rect x="895" y="305" width="170" height="95" rx="16" fill="#FBFAF6" stroke="#DDD7CD"/><path d="M908 314 h144" stroke="#fff" stroke-width="2"/><rect x="935" y="337" width="94" height="39" rx="20" fill="#1F4A38"/><ellipse cx="1001" cy="356" rx="29" ry="29" fill="#7C9A8A" stroke="#F7F4ED" stroke-width="2" filter="url(#softshadow)"/><path d="M1017 366 l18 34 l8 -14 l14 6 l-17 -34 z" fill="#151914"/></g><text x="220" y="455" font-family="Arial" font-size="16" font-weight="700" fill="#172019" text-anchor="middle">Lower autonomy and consequence</text><text x="600" y="455" font-family="Arial" font-size="16" font-weight="700" fill="#172019" text-anchor="middle">Medium autonomy and consequence</text><text x="980" y="455" font-family="Arial" font-size="16" font-weight="700" fill="#172019" text-anchor="middle">High autonomy and consequence</text><line x1="110" y1="540" x2="1090" y2="540" stroke="#7A9A89" stroke-width="3"/><path d="M1090 540 l-14 -8 M1090 540 l-14 8" stroke="#7A9A89" stroke-width="3" fill="none"/><circle cx="220" cy="540" r="12" fill="#1F4A38" filter="url(#softshadow)"/><text x="220" y="595" font-family="Arial" font-size="22" font-weight="700" fill="#172019" text-anchor="middle">Observe</text><text x="220" y="624" font-family="Arial" font-size="14" fill="#656961" text-anchor="middle">Monitor use</text><circle cx="600" cy="540" r="12" fill="#1F4A38" filter="url(#softshadow)"/><text x="600" y="595" font-family="Arial" font-size="22" font-weight="700" fill="#172019" text-anchor="middle">Review</text><text x="600" y="624" font-family="Arial" font-size="14" fill="#656961" text-anchor="middle">Verify outputs</text><circle cx="980" cy="540" r="12" fill="#1F4A38" filter="url(#softshadow)"/><text x="980" y="595" font-family="Arial" font-size="22" font-weight="700" fill="#172019" text-anchor="middle">Require approval</text><text x="980" y="624" font-family="Arial" font-size="14" fill="#656961" text-anchor="middle">Ensure stop authority</text><text x="600" y="700" font-family="Georgia,serif" font-size="18" fill="#172019" text-anchor="middle">Control should grow with autonomy, consequence and difficulty of reversal.</text></svg>