<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Transformation</title><desc>Evidence does not change the plan — a decision does.</desc><defs>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#6B645A" flood-opacity=".20"/></filter>
<filter id="softshadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#6B645A" flood-opacity=".13"/></filter>
<linearGradient id="greenFront" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#315F49"/><stop offset="1" stop-color="#173B2C"/></linearGradient>
<linearGradient id="greenSide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#153628"/><stop offset="1" stop-color="#0D291E"/></linearGradient>
<linearGradient id="greenTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#749180"/><stop offset="1" stop-color="#426A55"/></linearGradient>
<linearGradient id="stoneFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFAF6"/><stop offset="1" stop-color="#E5E0D5"/></linearGradient>
<linearGradient id="stoneTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0ECE4"/></linearGradient>
<linearGradient id="stoneSide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DDD7CC"/><stop offset="1" stop-color="#C8C1B5"/></linearGradient>
<linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DCE9E1"/><stop offset="1" stop-color="#C9DCCF"/></linearGradient>
<pattern id="marble" width="54" height="54" patternUnits="userSpaceOnUse"><rect width="54" height="54" fill="#234936"/><path d="M-8 39 C8 24,12 8,30 -4 M12 60 C26 46,31 28,58 18 M-5 14 C9 19,18 24,27 38" fill="none" stroke="#8BA394" stroke-width="2" opacity=".45"/><path d="M4 46 C18 36,25 16,43 5 M30 58 C36 42,47 34,62 31" fill="none" stroke="#C7D0C8" stroke-width="1" opacity=".3"/></pattern>
</defs><rect width="1200" height="760" fill="#F7F4ED"/><text x="70" y="80" font-family="Georgia,serif" font-size="62" fill="#172019">Transformation</text><text x="70" y="125" font-family="Georgia,serif" font-size="28" fill="#172019">Evidence does not change the plan — a decision does.</text><line x1="110" y1="365" x2="800" y2="365" stroke="#7A9A89" stroke-width="3"/><circle cx="110" cy="365" r="12" fill="#6E8F7F" filter="url(#softshadow)"/><text x="110" y="430" font-family="Arial" font-size="22" font-weight="700" fill="#172019" text-anchor="middle">Plan</text><text x="110" y="462" font-family="Arial" font-size="15" fill="#656961" text-anchor="middle">Set direction</text><circle cx="330" cy="365" r="12" fill="#6E8F7F" filter="url(#softshadow)"/><text x="330" y="430" font-family="Arial" font-size="22" font-weight="700" fill="#172019" text-anchor="middle">Execution</text><text x="330" y="462" font-family="Arial" font-size="15" fill="#656961" text-anchor="middle">Do the work</text><circle cx="555" cy="365" r="12" fill="#6E8F7F" filter="url(#softshadow)"/><text x="555" y="430" font-family="Arial" font-size="22" font-weight="700" fill="#172019" text-anchor="middle">Evidence</text><text x="555" y="462" font-family="Arial" font-size="15" fill="#656961" text-anchor="middle">See what works</text><circle cx="800" cy="365" r="28" fill="#1F4A38" filter="url(#softshadow)"/><text x="800" y="430" font-family="Arial" font-size="22" font-weight="700" fill="#172019" text-anchor="middle">Decision</text><text x="800" y="462" font-family="Arial" font-size="15" fill="#656961" text-anchor="middle">Based on evidence</text><g filter="url(#softshadow)"><rect x="795" y="250" width="8" height="68" rx="3" fill="#1F4A38"/><path d="M800 260 h52 l18 -15 l-18 -15 h-52 z" fill="#7F9C8D"/><path d="M800 294 h-52 l-18 -15 l18 -15 h52 z" fill="#A6B8AE"/></g><path d="M828 365 C900 355,915 285,995 260" stroke="#1F4A38" stroke-width="3" fill="none"/><path d="M828 365 C900 380,915 470,995 500" stroke="#8D8E88" stroke-width="2" fill="none"/><circle cx="1015" cy="255" r="15" fill="#6E8F7F" filter="url(#softshadow)"/><circle cx="1015" cy="505" r="15" fill="#9A9B95" filter="url(#softshadow)"/><text x="1060" y="263" font-family="Arial" font-size="23" font-weight="700" fill="#172019">Keep</text><text x="1060" y="295" font-family="Arial" font-size="15" fill="#656961">Continue with the plan</text><text x="1060" y="513" font-family="Arial" font-size="23" font-weight="700" fill="#172019">Change</text><text x="1060" y="545" font-family="Arial" font-size="15" fill="#656961">Adjust direction</text><text x="600" y="675" font-family="Georgia,serif" font-size="19" fill="#172019" text-anchor="middle">Adaptation does not mean constant change.</text><text x="600" y="704" font-family="Georgia,serif" font-size="17" fill="#656961" text-anchor="middle">It means changing when evidence passes through the right decision point.</text></svg>