<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Transformation</title><desc id="desc">Evidence does not change the plan — a decision does.</desc><rect width="1200" height="760" fill="#F5F2EA"/><text x="70" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#151914">Transformation</text><text x="70" y="125" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#151914">Evidence does not change the plan — a decision does.</text><line x1="110" y1="365" x2="800" y2="365" stroke="#6E8F7F" stroke-width="3"/><circle cx="110" cy="365" r="12" fill="#6E8F7F"/><text x="110" y="430" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#151914" text-anchor="middle">Plan</text><text x="110" y="468" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6F726C" text-anchor="middle">Set direction</text><circle cx="330" cy="365" r="12" fill="#6E8F7F"/><text x="330" y="430" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#151914" text-anchor="middle">Execution</text><text x="330" y="459" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6F726C" text-anchor="middle">Execute</text><text x="330" y="481" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6F726C" text-anchor="middle">the work</text><circle cx="555" cy="365" r="12" fill="#6E8F7F"/><text x="555" y="430" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#151914" text-anchor="middle">Evidence</text><text x="555" y="459" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6F726C" text-anchor="middle">Learn</text><text x="555" y="481" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6F726C" text-anchor="middle">what works</text><circle cx="800" cy="365" r="28" fill="#1F4A38"/><text x="800" y="430" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#151914" text-anchor="middle">Decision</text><text x="800" y="459" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6F726C" text-anchor="middle">Act on</text><text x="800" y="481" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6F726C" text-anchor="middle">the evidence</text><path d="M828 365 C900 355,915 285,995 260" stroke="#1F4A38" stroke-width="3" fill="none"/><path d="M828 365 C900 380,915 470,995 500" stroke="#6F726C" stroke-width="2" fill="none"/><circle cx="1015" cy="255" r="14" fill="#6E8F7F"/><circle cx="1015" cy="505" r="14" fill="#999A93"/><text x="1060" y="263" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#151914">Keep</text><text x="1060" y="296" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6F726C">Continue with the plan</text><text x="1060" y="513" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#151914">Change</text><text x="1060" y="546" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6F726C">Adjust direction</text><line x1="800" y1="300" x2="800" y2="250" stroke="#1F4A38" stroke-width="5"/><path d="M800 262 h45 l18 -16 l-18 -16 h-45" fill="#6E8F7F" opacity=".9"/><path d="M800 282 h-45 l-18 -16 l18 -16 h45" fill="#6E8F7F" opacity=".6"/><text x="600" y="675" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#151914" text-anchor="middle">Adaptation does not mean constant change.</text><text x="600" y="704" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#6F726C" text-anchor="middle">It means changing course when evidence reaches the right decision point.</text></svg>