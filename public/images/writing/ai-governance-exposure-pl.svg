<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">AI Governance</title><desc id="desc">Większa ekspozycja wymaga mocniejszej kontroli.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".08"/></filter></defs><rect width="1200" height="760" fill="#F5F2EA"/><text x="70" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#151914">AI Governance</text><text x="70" y="125" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#151914">Większa ekspozycja wymaga mocniejszej kontroli.</text><text x="220" y="205" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#151914" text-anchor="middle">1. Wsparcie pracy</text><text x="220" y="235" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6F726C" text-anchor="middle">AI przygotowuje</text><text x="220" y="257" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6F726C" text-anchor="middle">np. notatkę, podsumowanie</text><rect x="135" y="300" width="170" height="105" rx="14" fill="#FBFAF6" stroke="#C9C8C0" filter="url(#shadow)"/><rect x="165" y="325" width="100" height="5" rx="2" fill="#6E8F7F" opacity=".65"/><rect x="165" y="345" width="80" height="5" rx="2" fill="#6E8F7F" opacity=".53"/><rect x="165" y="365" width="65" height="5" rx="2" fill="#6E8F7F" opacity=".41"/><circle cx="275" cy="382" r="24" fill="#6E8F7F"/><text x="275" y="389" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FBFAF6" text-anchor="middle">✦</text><text x="220" y="455" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#151914" text-anchor="middle">Niższa autonomia i konsekwencja</text><text x="600" y="205" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#151914" text-anchor="middle">2. Rekomendacja</text><text x="600" y="235" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6F726C" text-anchor="middle">AI rekomenduje decyzję,</text><text x="600" y="257" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6F726C" text-anchor="middle">np. dla klienta</text><rect x="515" y="300" width="170" height="105" rx="14" fill="#FBFAF6" stroke="#C9C8C0" filter="url(#shadow)"/><path d="M545 325 h110 v50 h-50 l-18 18 v-18 h-37 z" fill="#EAE7DF" stroke="#C9C8C0"/><rect x="565" y="340" width="75" height="4" rx="2" fill="#6E8F7F"/><rect x="565" y="357" width="58" height="4" rx="2" fill="#6E8F7F"/><circle cx="655" cy="382" r="24" fill="#6E8F7F"/><text x="655" y="389" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FBFAF6" text-anchor="middle">+</text><text x="600" y="455" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#151914" text-anchor="middle">Średnia autonomia i konsekwencja</text><text x="980" y="205" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#151914" text-anchor="middle">3. Samodzielne działanie</text><text x="980" y="235" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6F726C" text-anchor="middle">AI wykonuje działanie</text><text x="980" y="257" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6F726C" text-anchor="middle">np. w systemie</text><rect x="895" y="300" width="170" height="105" rx="14" fill="#FBFAF6" stroke="#C9C8C0" filter="url(#shadow)"/><rect x="935" y="338" width="90" height="36" rx="18" fill="#1F4A38"/><circle cx="1000" cy="356" r="28" fill="#6E8F7F" stroke="#FBFAF6" stroke-width="2"/><path d="M1016 365 l18 34 l8 -14 l14 6 l-17 -34 z" fill="#151914"/><text x="980" y="455" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#151914" text-anchor="middle">Wysoka autonomia i konsekwencja</text><line x1="110" y1="540" x2="1090" y2="540" stroke="#6E8F7F" stroke-width="3"/><path d="M1090 540 l-14 -8 M1090 540 l-14 8" stroke="#6E8F7F" stroke-width="3" fill="none"/><circle cx="220" cy="540" r="12" fill="#1F4A38"/><text x="220" y="595" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#151914" text-anchor="middle">Obserwuj</text><text x="220" y="624" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6F726C" text-anchor="middle">Monitoruj wykorzystanie</text><circle cx="600" cy="540" r="12" fill="#1F4A38"/><text x="600" y="595" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#151914" text-anchor="middle">Sprawdzaj</text><text x="600" y="624" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6F726C" text-anchor="middle">Weryfikuj wyniki</text><circle cx="980" cy="540" r="12" fill="#1F4A38"/><text x="980" y="595" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#151914" text-anchor="middle">Wymagaj zgody</text><text x="980" y="624" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6F726C" text-anchor="middle">Zapewnij możliwość zatrzymania</text><text x="600" y="700" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#151914" text-anchor="middle">Kontrola powinna rosnąć wraz z autonomią, konsekwencją i trudnością odwrócenia skutków.</text></svg>