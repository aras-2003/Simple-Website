<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Architecture</title><desc id="desc">Put each decision at the right level.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".08"/></filter><linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A5B45"/><stop offset="1" stop-color="#153A2B"/></linearGradient><linearGradient id="gSoft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFAF6"/><stop offset="1" stop-color="#E7E2D8"/></linearGradient></defs><rect width="1200" height="760" fill="#F5F2EA"/><text x="70" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#151914">Architecture</text><text x="70" y="125" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#151914">Put each decision at the right level.</text><rect x="70" y="352" width="160" height="58" rx="3" fill="url(#gSoft)" filter="url(#shadow)"/><rect x="115" y="287" width="70" height="70" rx="5" fill="url(#gGreen)" filter="url(#shadow)"/><text x="150" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#151914" text-anchor="middle">Team</text><text x="150" y="510" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6F726C" text-anchor="middle">Everyday decisions</text><rect x="307.5" y="312" width="205" height="98" rx="3" fill="url(#gSoft)" filter="url(#shadow)"/><rect x="355" y="252" width="52" height="52" rx="4" fill="url(#gGreen)" filter="url(#shadow)"/><rect x="410" y="212" width="52" height="52" rx="4" fill="url(#gGreen)" filter="url(#shadow)"/><rect x="410" y="257" width="52" height="52" rx="4" fill="url(#gGreen)" filter="url(#shadow)"/><text x="410" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#151914" text-anchor="middle">Team within guardrails</text><text x="410" y="503" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6F726C" text-anchor="middle">Decisions within</text><text x="410" y="527" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6F726C" text-anchor="middle">agreed rules</text><rect x="575" y="260" width="230" height="150" rx="3" fill="url(#gSoft)" filter="url(#shadow)"/><rect x="642" y="150" width="96" height="116" rx="5" fill="#C8CCC6" filter="url(#shadow)"/><rect x="659" y="171" width="12" height="13" fill="#EAE7DF"/><rect x="682" y="171" width="12" height="13" fill="#EAE7DF"/><rect x="705" y="171" width="12" height="13" fill="#EAE7DF"/><rect x="659" y="193" width="12" height="13" fill="#EAE7DF"/><rect x="682" y="193" width="12" height="13" fill="#EAE7DF"/><rect x="705" y="193" width="12" height="13" fill="#EAE7DF"/><rect x="659" y="215" width="12" height="13" fill="#EAE7DF"/><rect x="682" y="215" width="12" height="13" fill="#EAE7DF"/><rect x="705" y="215" width="12" height="13" fill="#EAE7DF"/><rect x="659" y="237" width="12" height="13" fill="#EAE7DF"/><rect x="682" y="237" width="12" height="13" fill="#EAE7DF"/><rect x="705" y="237" width="12" height="13" fill="#EAE7DF"/><text x="690" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#151914" text-anchor="middle">Organization</text><text x="690" y="503" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6F726C" text-anchor="middle">Decisions with</text><text x="690" y="527" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6F726C" text-anchor="middle">broader impact</text><rect x="860" y="205" width="210" height="205" rx="3" fill="url(#gSoft)" filter="url(#shadow)"/><rect x="917" y="65" width="96" height="148" rx="5" fill="url(#gGreen)" filter="url(#shadow)"/><text x="965" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#151914" text-anchor="middle">Exception</text><text x="965" y="503" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6F726C" text-anchor="middle">Strategic or</text><text x="965" y="527" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6F726C" text-anchor="middle">non-standard decisions</text><line x1="90" y1="585" x2="1100" y2="585" stroke="#151914" stroke-width="2"/><path d="M1100 585 l-14 -8 M1100 585 l-14 8" stroke="#151914" stroke-width="2" fill="none"/><text x="90" y="620" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#6F726C">Low impact</text><text x="90" y="644" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6F726C">Easy to reverse</text><text x="595" y="620" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#6F726C" text-anchor="middle">Broader impact</text><text x="595" y="644" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6F726C" text-anchor="middle">Higher cost of error</text><text x="1098" y="620" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#6F726C" text-anchor="end">Highest impact</text><text x="1098" y="644" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6F726C" text-anchor="end">Hard to reverse</text><text x="600" y="700" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#151914" text-anchor="middle">Not every architecture decision belongs at the highest level.</text><text x="600" y="727" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#6F726C" text-anchor="middle">What matters is where the decision belongs — not only what was decided.</text></svg>