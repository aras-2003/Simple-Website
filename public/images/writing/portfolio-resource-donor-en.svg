<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Portfolio</title><desc id="desc">A new priority needs a resource source.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".08"/></filter><linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A5B45"/><stop offset="1" stop-color="#153A2B"/></linearGradient><linearGradient id="gSoft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFAF6"/><stop offset="1" stop-color="#E7E2D8"/></linearGradient></defs><rect width="1200" height="760" fill="#F5F2EA"/><text x="70" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#151914">Portfolio</text><text x="70" y="125" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#151914">A new priority needs a resource source.</text><text x="170" y="215" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#151914">Current portfolio</text><text x="600" y="215" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#151914" text-anchor="middle">What can happen?</text><text x="1005" y="215" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#151914" text-anchor="middle">New priority</text><text x="70" y="285" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#151914">Product A</text><rect x="245" y="257" width="160" height="36" rx="8" fill="#FBFAF6" stroke="#C9C8C0"/><rect x="245" y="257" width="67" height="36" rx="8" fill="#6E8F7F"/><path d="M405 275 C470 275,485 365,520 385" stroke="#6E8F7F" stroke-width="2" fill="none" opacity=".8"/><text x="70" y="345" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#151914">Product B</text><rect x="245" y="317" width="160" height="36" rx="8" fill="#FBFAF6" stroke="#C9C8C0"/><rect x="245" y="317" width="74" height="36" rx="8" fill="#6E8F7F"/><path d="M405 335 C470 335,485 365,520 385" stroke="#6E8F7F" stroke-width="2" fill="none" opacity=".8"/><text x="70" y="405" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#151914">Initiative C</text><rect x="245" y="377" width="160" height="36" rx="8" fill="#FBFAF6" stroke="#C9C8C0"/><rect x="245" y="377" width="99" height="36" rx="8" fill="#6E8F7F"/><path d="M405 395 C470 395,485 365,520 385" stroke="#6E8F7F" stroke-width="2" fill="none" opacity=".8"/><text x="70" y="465" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#151914">Run</text><rect x="245" y="437" width="160" height="36" rx="8" fill="#FBFAF6" stroke="#C9C8C0"/><rect x="245" y="437" width="106" height="36" rx="8" fill="#6E8F7F"/><path d="M405 455 C470 455,485 365,520 385" stroke="#6E8F7F" stroke-width="2" fill="none" opacity=".8"/><text x="70" y="525" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#151914">Talent development</text><rect x="245" y="497" width="160" height="36" rx="8" fill="#FBFAF6" stroke="#C9C8C0"/><rect x="245" y="497" width="61" height="36" rx="8" fill="#6E8F7F"/><path d="M405 515 C470 515,485 365,520 385" stroke="#6E8F7F" stroke-width="2" fill="none" opacity=".8"/><text x="70" y="585" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#151914">Other</text><rect x="245" y="557" width="160" height="36" rx="8" fill="#FBFAF6" stroke="#C9C8C0"/><rect x="245" y="557" width="45" height="36" rx="8" fill="#6E8F7F"/><path d="M405 575 C470 575,485 365,520 385" stroke="#6E8F7F" stroke-width="2" fill="none" opacity=".8"/><rect x="520" y="270" width="250" height="90" rx="14" fill="#FBFAF6" stroke="#C9C8C0" filter="url(#shadow)"/><text x="645" y="302" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#151914" text-anchor="middle">Stop</text><text x="645" y="328" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6F726C" text-anchor="middle">The new priority</text><text x="645" y="348" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6F726C" text-anchor="middle">does not start.</text><path d="M770 315 C815 315,820 410,850 410" stroke="#6E8F7F" stroke-width="2" fill="none"/><rect x="520" y="385" width="250" height="90" rx="14" fill="#DDE9E1" stroke="#C9C8C0" filter="url(#shadow)"/><text x="645" y="417" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#151914" text-anchor="middle">Reallocate</text><text x="645" y="449" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6F726C" text-anchor="middle">Resources move from another area.</text><path d="M770 430 C815 430,820 410,850 410" stroke="#6E8F7F" stroke-width="2" fill="none"/><rect x="520" y="500" width="250" height="90" rx="14" fill="#FBFAF6" stroke="#C9C8C0" filter="url(#shadow)"/><text x="645" y="532" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#151914" text-anchor="middle">Add resources</text><text x="645" y="564" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6F726C" text-anchor="middle">Total capacity is explicitly increased.</text><path d="M770 545 C815 545,820 410,850 410" stroke="#6E8F7F" stroke-width="2" fill="none"/><line x1="850" y1="410" x2="930" y2="410" stroke="#1F4A38" stroke-width="3"/><path d="M930 410 l-15 -9 M930 410 l-15 9" stroke="#1F4A38" stroke-width="3" fill="none"/><rect x="950" y="425" width="200" height="85" rx="4" fill="url(#gSoft)" filter="url(#shadow)"/><rect x="1005" y="330" width="90" height="95" rx="6" fill="url(#gGreen)" filter="url(#shadow)"/><line x1="1025" y1="310" x2="1021" y2="285" stroke="#1F4A38" stroke-width="4" stroke-linecap="round"/><line x1="1050" y1="310" x2="1050" y2="285" stroke="#1F4A38" stroke-width="4" stroke-linecap="round"/><line x1="1075" y1="310" x2="1079" y2="285" stroke="#1F4A38" stroke-width="4" stroke-linecap="round"/><text x="600" y="690" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#151914" text-anchor="middle">Strategy becomes visible when scarce resources stop flowing everywhere at once.</text></svg>